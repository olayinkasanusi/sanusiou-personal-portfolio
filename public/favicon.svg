<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Core Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Accent / Terminal Green Pulse -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  
  <!-- Outer Modern Gradient Rim -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="none" stroke="url(#borderGrad)" stroke-width="12" stroke-opacity="0.8" />
  
  <!-- Subtle Internal Grid Pattern Lines -->
  <path d="M128 24v464M256 24v464M384 24v464M24 128h464M24 256h464M24 384h464" stroke="#334155" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Iconic Stylized Interlocking Monogram (S & Full-Stack Circuit Architecture) -->
  <!-- Upper Curve of S -->
  <path d="M344 168c-12-24-38-40-76-40-54 0-96 32-96 76 0 42 32 62 82 76 56 16 78 28 78 58 0 34-32 54-76 54-46 0-78-22-90-50" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Code Bracket Accents: Left (<) and Right (>) -->
  <path d="M136 216l-32 40 32 40" fill="none" stroke="#38BDF8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <path d="M376 216l32 40-32 40" fill="none" stroke="#818CF8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Active Full-Stack / Server Live Node Indicator Dot -->
  <circle cx="352" cy="168" r="16" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <circle cx="352" cy="168" r="8" fill="#FFFFFF" />
</svg>
